# Imagen publicada: el usuario no compila nada.
services:
  seanime:
    image: ghcr.io/below-z3r0/seanime:${IMAGE:-3.10.4}
    container_name: seanime
    restart: unless-stopped
    user: "1000:1000"

    ports:
      - "43211:43211"

    volumes:
      - ${SEANIME_HOME:-${HOME}/.local/share/seanime}/data:/data
      - ${SEANIME_HOME:-${HOME}/.local/share/seanime}/anime:/anime
      - ${SEANIME_HOME:-${HOME}/.local/share/seanime}/downloads:/downloads

    environment:
      SEANIME_DATA_DIR: /data
      SEANIME_SERVER_HOST: "0.0.0.0"
      SEANIME_SERVER_PORT: "43211"
      TZ: ${TZ:-America/Panama}

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:43211/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
