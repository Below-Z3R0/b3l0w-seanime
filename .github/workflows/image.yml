name: seanime-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de 5rahim/seanime (sin la v)"
        required: true
        default: "3.10.4"

concurrency:
  group: seanime-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: 5rahim/seanime
          ref: v${{ inputs.version }}
          path: seanime-src

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build for smoke test
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: seanime-src
          file: ./Dockerfile
          build-contexts: |
            seed=./seed
          load: true
          push: false
          tags: seanime:ci
          labels: |
            org.opencontainers.image.source=https://github.com/5rahim/seanime
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Smoke test
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/data" "$tmp/anime" "$tmp/downloads"
          chown -R 1000:1000 "$tmp" 2>/dev/null || sudo chown -R 1000:1000 "$tmp"
          docker run -d --name seanime-ci \
            -p 43211:43211 \
            -v "$tmp/data:/data" \
            -v "$tmp/anime:/anime" \
            -v "$tmp/downloads:/downloads" \
            -e TZ=UTC \
            -e SEANIME_SERVER_HOST=0.0.0.0 \
            -e SEANIME_SERVER_PORT=43211 \
            seanime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:43211/api/v1/status >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:43211/api/v1/status >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:43211/)" = "200"
          docker exec seanime-ci test -f /data/.seeded
          docker exec seanime-ci test -f /data/seanime.db
          docker rm -f seanime-ci
          sudo rm -rf "$tmp"

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker ps -a || true
          docker logs seanime-ci 2>&1 | tail -100 || true

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          set -euo pipefail
          img=ghcr.io/below-z3r0/seanime
          docker tag seanime:ci "$img:${{ inputs.version }}"
          docker tag seanime:ci "$img:sha-${{ github.sha }}"
          docker tag seanime:ci "$img:latest"
          docker push "$img:${{ inputs.version }}"
          docker push "$img:sha-${{ github.sha }}"
          docker push "$img:latest"
