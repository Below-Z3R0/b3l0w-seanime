name: seanime-image-arm64

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag de 5rahim/seanime (sin la v)"
        required: true
        default: "3.10.4"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: 5rahim/seanime
          ref: v${{ inputs.version }}
          path: seanime-src

      - uses: docker/setup-buildx-action@v3.10.0

      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6.15.0
        with:
          context: seanime-src
          file: ./Dockerfile
          build-contexts: |
            seed=./seed
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/below-z3r0/seanime:arm64-${{ inputs.version }}
            ghcr.io/below-z3r0/seanime:arm64-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/5rahim/seanime
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
